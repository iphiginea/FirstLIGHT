<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2140;
    --plum:#4A3B63;
    --ember:#E8935F;
    --mist:#F0E6D8;
    --feather:#8FA3A0;
    --gold:#F2C879;
    --sky-progress: 0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Public Sans', sans-serif;
    color:var(--mist);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
    overflow-x:hidden;
    background: linear-gradient(180deg,
      var(--ink) 0%,
      color-mix(in srgb, var(--ink) calc(100% - (var(--sky-progress) * 60%)), var(--plum) calc(var(--sky-progress) * 60%)) 45%,
      color-mix(in srgb, var(--plum) calc(100% - (var(--sky-progress) * 80%)), var(--ember) calc(var(--sky-progress) * 80%)) 75%,
      color-mix(in srgb, var(--ember) calc(100% - (var(--sky-progress) * 70%)), var(--gold) calc(var(--sky-progress) * 70%)) 100%
    );
    transition: background 1.4s ease;
    position:relative;
  }
  .stars{
    position:fixed; inset:0; pointer-events:none;
    opacity: calc(1 - var(--sky-progress));
    transition: opacity 1.4s ease;
  }
  .star{
    position:absolute; width:2px; height:2px; background:var(--mist);
    border-radius:50%; opacity:.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:.15;} 50%{opacity:.7;} }

  .wrap{ width:100%; max-width:560px; text-align:center; position:relative; z-index:1; }

  h1{
    font-family:'Fraunces', serif;
    font-weight:300;
    font-style:italic;
    font-size:clamp(2.6rem, 8vw, 4rem);
    letter-spacing:-0.01em;
    margin:0 0 .3rem;
    color:var(--mist);
    white-space:nowrap;
  }
  h1 .big{
    font-weight:500;
    font-style:normal;
    color:var(--mist);
  }
  h1 .small{
    font-weight:300;
    font-style:italic;
    color:var(--feather);
  }
  .tagline{
    font-size:.95rem;
    color:var(--feather);
    letter-spacing:.02em;
    margin:0 0 3.5rem;
    font-weight:300;
  }

  button{
    font-family:'Public Sans', sans-serif;
    background:none;
    border:1px solid color-mix(in srgb, var(--mist) 35%, transparent);
    color:var(--mist);
    padding:.85rem 2rem;
    border-radius:999px;
    font-size:.95rem;
    letter-spacing:.02em;
    cursor:pointer;
    transition: all .3s ease;
  }
  button:hover:not(:disabled){
    border-color:var(--gold);
    background:color-mix(in srgb, var(--gold) 12%, transparent);
  }
  button:disabled{ opacity:.4; cursor:default; }
  button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  .status{
    min-height:1.4em;
    font-size:.85rem;
    color:var(--feather);
    letter-spacing:.02em;
    margin-top:1.6rem;
    font-style:italic;
    font-family:'Fraunces', serif;
  }

  .location-form{ display:flex; flex-direction:column; gap:.9rem; align-items:center; }
  .location-form input{
    font-family:'Public Sans', sans-serif;
    background:color-mix(in srgb, var(--mist) 8%, transparent);
    border:1px solid color-mix(in srgb, var(--mist) 25%, transparent);
    color:var(--mist);
    padding:.8rem 1.2rem;
    border-radius:999px;
    font-size:.95rem;
    width:100%;
    max-width:320px;
    text-align:center;
  }
  .location-form input::placeholder{ color:color-mix(in srgb, var(--mist) 55%, transparent); }
  .or{ font-size:.75rem; color:var(--feather); letter-spacing:.15em; text-transform:uppercase; margin:.2rem 0; }

  .keys{
    margin-top:2.5rem;
    padding-top:1.6rem;
    border-top:1px solid color-mix(in srgb, var(--mist) 15%, transparent);
    font-size:.8rem;
    color:var(--feather);
  }
  .keys summary{ cursor:pointer; letter-spacing:.02em; }
  .keys-fields{ display:flex; flex-direction:column; gap:.7rem; margin-top:1rem; align-items:center; }
  .keys-fields input{
    font-family:'IBM Plex Mono', monospace;
    font-size:.8rem;
    background:color-mix(in srgb, var(--mist) 6%, transparent);
    border:1px solid color-mix(in srgb, var(--mist) 20%, transparent);
    color:var(--mist);
    padding:.6rem 1rem;
    border-radius:8px;
    width:100%;
    max-width:340px;
  }
  .keys-hint{ font-size:.72rem; opacity:.7; max-width:340px; margin:0 auto; line-height:1.5; }
  .keys-hint a{ color:var(--gold); }

  .chorus{ display:none; flex-direction:column; gap:.9rem; margin:2.5rem 0; }
  .bird-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding:.9rem 1.3rem;
    border-radius:14px;
    background:color-mix(in srgb, var(--mist) 6%, transparent);
    border:1px solid color-mix(in srgb, var(--mist) 12%, transparent);
    opacity:0;
    transform:translateY(8px);
    transition: opacity .8s ease, transform .8s ease, background .3s ease;
    text-align:left;
  }
  .bird-card-info{ display:flex; align-items:center; gap:1rem; min-width:0; }
  .bird-card.muted{ opacity:.55 !important; }
  .mute-btn{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid color-mix(in srgb, var(--mist) 25%, transparent);
    background:transparent;
    color:var(--mist);
    padding:0;
    font-size:1rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .mute-btn:hover{ border-color:var(--gold); }
  .bird-card.muted .mute-btn{ color:var(--feather); border-color:color-mix(in srgb, var(--feather) 40%, transparent); }
  .bird-card.active{
    opacity:1;
    transform:translateY(0);
    background:color-mix(in srgb, var(--gold) 10%, transparent);
    border-color:color-mix(in srgb, var(--gold) 30%, transparent);
  }
  .pulse{
    width:9px; height:9px; border-radius:50%;
    background:var(--feather);
    flex-shrink:0;
  }
  .bird-card.active .pulse{
    background:var(--gold);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--gold) 50%, transparent);} 50%{ box-shadow:0 0 0 6px transparent;} }
  .bird-name{
    font-family:'Fraunces', serif;
    font-size:1.05rem;
    color:var(--mist);
  }
  .bird-sci{
    font-family:'IBM Plex Mono', monospace;
    font-style:italic;
    font-size:.72rem;
    color:var(--feather);
    display:block;
    margin-top:.15rem;
  }

  .controls{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; margin-top:1rem; }
  .controls button{ font-size:.85rem; padding:.7rem 1.5rem; }

  .hidden{ display:none !important; }

  footer{
    margin-top:3rem;
    font-size:.7rem;
    color:color-mix(in srgb, var(--feather) 70%, transparent);
    letter-spacing:.03em;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }

  /* ---------- Focus / ambient mode ---------- */
  body.focus .tagline,
  body.focus .chorus,
  body.focus .keys,
  body.focus footer,
  body.focus .controls button:not(#btn-focus-hint){
    opacity:0;
    pointer-events:none;
    height:0;
    margin:0;
    overflow:hidden;
    transition: opacity .6s ease;
  }
  body.focus .controls{ margin-top:0; }
  body.focus h1{ opacity:.8; transition: opacity .6s ease; }
  .focus-hint{
    position:fixed;
    bottom:5vh; left:0; right:0;
    text-align:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:.75rem;
    color:var(--mist);
    opacity:0;
    pointer-events:none;
    transition: opacity 1s ease;
    z-index:2;
  }
  body.focus .focus-hint{ opacity:.28; }

  /* ---------- Postcard ---------- */
  .postcard{
    position:fixed; inset:0;
    background:color-mix(in srgb, var(--ink) 88%, black 12%);
    display:flex; align-items:center; justify-content:center;
    padding:6vw;
    z-index:10;
  }
  .postcard-inner{
    position:relative;
    width:100%; max-width:420px;
    background:var(--mist);
    color:var(--ink);
    border-radius:4px;
    padding:2.2rem 1.8rem 1.8rem;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    font-family:'Public Sans', sans-serif;
  }
  .postcard-close{
    position:absolute; top:.7rem; right:.9rem;
    background:none; border:none; color:var(--ink);
    font-size:1.4rem; line-height:1; cursor:pointer; padding:.2rem .5rem;
  }
  .stamp{
    position:absolute; top:1.1rem; right:1.1rem;
    width:52px; height:64px;
    border:3px dotted color-mix(in srgb, var(--ink) 45%, transparent);
    border-radius:2px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:var(--mist);
    transform:rotate(6deg);
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .stamp img{
    width:100%; height:100%;
    object-fit:cover;
  }
  .stamp.stamp-fallback{
    color:color-mix(in srgb, var(--ink) 55%, transparent);
  }
  .stamp.stamp-fallback img{ display:none; }
  .stamp.stamp-fallback::after{
    content:'✦';
    font-size:1.1rem;
  }
  .postcard-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:.7rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:color-mix(in srgb, var(--ink) 55%, transparent);
    margin:1.6rem 0 .4rem;
  }
  .postcard-place{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:normal;
    font-size:1.7rem;
    margin:0 0 .2rem;
  }
  .postcard-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:.75rem;
    color:color-mix(in srgb, var(--ink) 60%, transparent);
    margin:0;
  }
  .postcard-divider{
    border-top:1px dashed color-mix(in srgb, var(--ink) 25%, transparent);
    margin:1.3rem 0;
  }
  .postcard-birds{
    list-style:none; padding:0; margin:0 0 1.4rem;
    display:flex; flex-direction:column; gap:.5rem;
    text-align:left;
  }
  .postcard-birds li{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:.95rem;
  }
  .postcard-birds li span{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-style:normal;
    font-size:.68rem;
    color:color-mix(in srgb, var(--ink) 55%, transparent);
  }
  .postcard-actions button{
    border-color:color-mix(in srgb, var(--ink) 30%, transparent);
    color:var(--ink);
    background:color-mix(in srgb, var(--ink) 6%, transparent);
  }
  .postcard-actions button:hover{
    border-color:var(--ember);
    background:color-mix(in srgb, var(--ember) 15%, transparent);
  }
  .postcard-note{
    font-size:.72rem;
    color:color-mix(in srgb, var(--ink) 55%, transparent);
    margin:.8rem 0 0;
    min-height:1.2em;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="wrap">
  <h1><span class="big">F</span><span class="small">irst</span><span class="big">Light</span></h1>
  <p class="tagline">five birds, wherever you are, whatever the season</p>

  <div id="stage-location">
    <div class="location-form">
      <button id="btn-geo">Use my location</button>
      <span class="or">or</span>
      <input id="input-place" type="text" placeholder="City, region, or postal code">
      <button id="btn-place">Find my chorus</button>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="chorus" id="chorus"></div>

  <div class="controls hidden" id="controls">
    <button id="btn-replay">Replay</button>
    <button id="btn-shuffle">New chorus, same place</button>
    <button id="btn-focus">Ambient mode</button>
    <button id="btn-postcard">View postcard</button>
    <button id="btn-reset">Change location</button>
  </div>

  <div class="postcard hidden" id="postcard">
    <div class="postcard-inner">
      <button class="postcard-close" id="btn-postcard-close" aria-label="Close postcard">&times;</button>
      <div class="stamp" aria-hidden="true">
        <img src="stamp.png" alt="" onerror="this.parentElement.classList.add('stamp-fallback')">
      </div>
      <p class="postcard-eyebrow">Wish you could hear this</p>
      <h2 class="postcard-place" id="postcard-place">—</h2>
      <p class="postcard-meta" id="postcard-meta">—</p>
      <div class="postcard-divider"></div>
      <ul class="postcard-birds" id="postcard-birds"></ul>
      <div class="postcard-actions">
        <button id="btn-share">Share this chorus</button>
      </div>
      <p class="postcard-note" id="postcard-share-note"></p>
    </div>
  </div>

  <footer>Bird sightings via eBird · recordings via Xeno-canto contributors</footer>
</div>

<p class="focus-hint" id="focus-hint">tap anywhere to return</p>

<script>
// ---------- Ambient stars ----------
const starsEl = document.getElementById('stars');
for(let i=0;i<40;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.left = Math.random()*100+'vw';
  s.style.top = Math.random()*70+'vh';
  s.style.animationDelay = (Math.random()*4)+'s';
  starsEl.appendChild(s);
}

// ---------- State ----------
let audioCtx = null;
let activeSources = [];
let currentSpecies = [];
let currentCoords = null;
let gainNodes = {};
let mutedBirds = new Set();
let placeLabel = '';
const EXCLUDED_SPECIES = new Set(['Turkey Vulture', 'Blue Jay']);
const FADE_SECONDS = 2.5;
const BIRD_PROXY_URL = 'https://firstlight-bird-proxy.kiah-harpool.workers.dev';

const statusEl = document.getElementById('status');
const chorusEl = document.getElementById('chorus');
const controlsEl = document.getElementById('controls');
const stageLocationEl = document.getElementById('stage-location');
try{
  localStorage.removeItem('firstlight_ebird_key');
  localStorage.removeItem('firstlight_xc_key');
}catch(e){}

function setSkyProgress(v){
  document.documentElement.style.setProperty('--sky-progress', String(v));
}
function setStatus(msg){ statusEl.textContent = msg; }

// ---------- Location entry points ----------
document.getElementById('btn-geo').addEventListener('click', () => {
  if(!navigator.geolocation){ setStatus('Geolocation isn\'t available — try entering a place instead.'); return; }
  setStatus('Finding you...');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      placeLabel = await reverseGeocode(lat, lng);
      startChorus(lat, lng);
    },
    () => setStatus('Couldn\'t get your location — try entering a place instead.')
  );
});

async function reverseGeocode(lat, lng){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`);
    const data = await res.json();
    const a = data.address || {};
    const place = a.city || a.town || a.village || a.county || a.state;
    return place ? (a.state && place !== a.state ? `${place}, ${a.state}` : place) : 'Somewhere near you';
  }catch(e){
    return 'Somewhere near you';
  }
}

document.getElementById('btn-place').addEventListener('click', async () => {
  const q = document.getElementById('input-place').value.trim();
  if(!q){ setStatus('Type a city, region, or postal code first.'); return; }
  setStatus('Locating "' + q + '"...');
  try{
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const data = await res.json();
    if(!data.length){ setStatus('Couldn\'t find that place — try a different spelling.'); return; }
    placeLabel = q;
    startChorus(parseFloat(data[0].lat), parseFloat(data[0].lon));
  }catch(e){
    setStatus('Location lookup failed. Check your connection and try again.');
  }
});

document.getElementById('btn-replay').addEventListener('click', () => playChorus(currentSpecies));
document.getElementById('btn-shuffle').addEventListener('click', () => startChorus(currentCoords.lat, currentCoords.lng));
document.getElementById('btn-focus').addEventListener('click', () => enterFocusMode());

function enterFocusMode(){
  document.body.classList.add('focus');
}
function exitFocusMode(){
  document.body.classList.remove('focus');
}
document.body.addEventListener('click', (e) => {
  if(document.body.classList.contains('focus') && e.target.id !== 'btn-focus'){
    exitFocusMode();
  }
});
document.getElementById('btn-postcard').addEventListener('click', openPostcard);
document.getElementById('btn-postcard-close').addEventListener('click', () => document.getElementById('postcard').classList.add('hidden'));
document.getElementById('btn-share').addEventListener('click', shareChorus);
document.getElementById('btn-reset').addEventListener('click', () => {
  stopAll();
  stageLocationEl.classList.remove('hidden');
  controlsEl.classList.add('hidden');
  chorusEl.style.display = 'none';
  chorusEl.innerHTML = '';
  setSkyProgress(0);
  setStatus('');
});

// ---------- Core flow ----------
async function startChorus(lat, lng){
  currentCoords = { lat, lng };
  stopAll();
  mutedBirds = new Set();
  chorusEl.innerHTML = '';
  chorusEl.style.display = 'flex';
  controlsEl.classList.add('hidden');
  setSkyProgress(0);
  setStatus('Listening for what\'s nearby...');

  try{
    const species = await fetchNearbySpecies(lat, lng);
    if(species.length < 5){
      setStatus('Not many recent sightings nearby — try a different or larger area.');
      return;
    }
    const picked = pickFive(species);
    setStatus('Finding their songs...');
    const withAudio = await attachRecordings(picked);
    const usable = withAudio.filter(b => b.audioUrl);
    if(usable.length < 3){
      setStatus(withAudio._firstIssue || 'Couldn\'t find enough recordings for this area — try again.');
      return;
    }
    currentSpecies = usable;
    stageLocationEl.classList.add('hidden');
    renderCards(usable);
    setStatus('');
    controlsEl.classList.remove('hidden');
    await playChorus(usable);
  }catch(err){
    console.error(err);
    setStatus('Error: ' + (err && err.message ? err.message : String(err)));
  }
}

async function fetchNearbySpecies(lat, lng){
  const url = `${BIRD_PROXY_URL}/ebird/recent?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}`;
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if(!res.ok) throw new Error('eBird request failed: ' + res.status);
  const data = await res.json();
  // de-dupe by species code, keep most recent obs per species
  const bySpecies = {};
  data.forEach(obs => {
    if(!bySpecies[obs.speciesCode] || obs.obsDt > bySpecies[obs.speciesCode].obsDt){
      bySpecies[obs.speciesCode] = obs;
    }
  });
  return Object.values(bySpecies)
    .filter(o => !EXCLUDED_SPECIES.has(o.comName))
    .map(o => ({
      comName: o.comName,
      sciName: o.sciName,
      speciesCode: o.speciesCode,
      obsDt: o.obsDt
    }));
}

function pickFive(species){
  // favor more recently-reported birds without making it fully deterministic
  const sorted = [...species].sort((a,b) => new Date(b.obsDt) - new Date(a.obsDt));
  const pool = sorted.slice(0, Math.max(15, Math.min(sorted.length, 40)));
  const shuffled = pool.sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 5);
}

async function attachRecordings(species){
  const results = [];
  let firstIssue = null;
  for(const bird of species){
    try{
      const url = `${BIRD_PROXY_URL}/xeno/recordings?sciName=${encodeURIComponent(bird.sciName)}`;
      const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if(!res.ok){
        const bodyText = await res.text();
        console.error('Xeno-canto HTTP error for', bird.sciName, res.status, bodyText);
        if(!firstIssue) firstIssue = `Xeno-canto returned ${res.status} for ${bird.sciName}: ${bodyText.slice(0,120)}`;
        results.push({ ...bird, audioUrl: null });
        continue;
      }
      const data = await res.json();
      const recs = data.recordings || [];
      const rec = recs.find(r => r.q === 'A') || recs.find(r => r.q === 'B') || recs[0];
      if(!rec && !firstIssue) firstIssue = `No recordings found for ${bird.sciName} (${bird.comName})`;
      results.push({ ...bird, audioUrl: rec ? rec.file : null });
    }catch(e){
      console.error('Xeno-canto fetch failed for', bird.sciName, e);
      if(!firstIssue) firstIssue = `Couldn't reach Xeno-canto for ${bird.sciName} — likely a CORS block: ${e.message}`;
      results.push({ ...bird, audioUrl: null });
    }
  }
  results._firstIssue = firstIssue;
  return results;
}

// ---------- Postcard ----------
function openPostcard(){
  if(!currentSpecies.length) return;
  document.getElementById('postcard-place').textContent = placeLabel || 'Somewhere near you';
  const dateStr = new Date().toLocaleDateString(undefined, { day:'numeric', month:'long', year:'numeric' });
  const coordStr = currentCoords ? `${currentCoords.lat.toFixed(2)}°, ${currentCoords.lng.toFixed(2)}°` : '';
  document.getElementById('postcard-meta').textContent = `${dateStr} · ${coordStr}`;
  const list = document.getElementById('postcard-birds');
  list.innerHTML = '';
  currentSpecies.forEach(b => {
    const li = document.createElement('li');
    li.innerHTML = `${b.comName}<span>${b.sciName}</span>`;
    list.appendChild(li);
  });
  document.getElementById('postcard-share-note').textContent = '';
  document.getElementById('postcard').classList.remove('hidden');
}

function buildShareUrl(){
  const payload = {
    birds: currentSpecies.map(b => ({ c: b.comName, s: b.sciName, x: b.speciesCode })),
    place: placeLabel,
    lat: currentCoords.lat,
    lng: currentCoords.lng
  };
  const encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('chorus', encoded);
  return url.toString();
}

async function shareChorus(){
  const url = buildShareUrl();
  const note = document.getElementById('postcard-share-note');
  const shareData = {
    title: 'First Light',
    text: `The dawn chorus from ${placeLabel || 'my spot'} — five birds, one morning.`,
    url
  };
  if(navigator.share){
    try{ await navigator.share(shareData); }catch(e){ /* user cancelled, ignore */ }
  }else{
    try{
      await navigator.clipboard.writeText(url);
      note.textContent = 'Link copied to your clipboard.';
    }catch(e){
      note.textContent = url;
    }
  }
}

// ---------- Load a shared chorus, if the URL has one ----------
(function loadSharedChorus(){
  const params = new URLSearchParams(window.location.search);
  const encoded = params.get('chorus');
  if(!encoded) return;
  try{
    const payload = JSON.parse(decodeURIComponent(atob(encoded)));
    placeLabel = payload.place || 'Somewhere near you';
    currentCoords = { lat: payload.lat, lng: payload.lng };
    const sharedBirds = payload.birds.map(b => ({ comName: b.c, sciName: b.s, speciesCode: b.x, obsDt: '' }));
    window.addEventListener('DOMContentLoaded', () => startSharedChorus(sharedBirds));
    if(document.readyState !== 'loading') startSharedChorus(sharedBirds);
  }catch(e){
    console.error('Could not parse shared chorus link', e);
  }
})();

async function startSharedChorus(birds){
  stopAll();
  mutedBirds = new Set();
  chorusEl.innerHTML = '';
  chorusEl.style.display = 'flex';
  controlsEl.classList.add('hidden');
  setSkyProgress(0);
  setStatus(`Loading the chorus from ${placeLabel}...`);
  try{
    const withAudio = await attachRecordings(birds);
    const usable = withAudio.filter(b => b.audioUrl);
    if(usable.length < 3){
      setStatus(withAudio._firstIssue || 'Couldn\'t load this shared chorus — try again.');
      return;
    }
    currentSpecies = usable;
    stageLocationEl.classList.add('hidden');
    renderCards(usable);
    setStatus('');
    controlsEl.classList.remove('hidden');
    await playChorus(usable);
  }catch(err){
    console.error(err);
    setStatus('Error: ' + (err && err.message ? err.message : String(err)));
  }
}
function renderCards(birds){
  chorusEl.innerHTML = '';
  birds.forEach(bird => {
    const card = document.createElement('div');
    card.className = 'bird-card';
    card.id = 'card-' + bird.speciesCode;
    card.innerHTML = `
      <span class="bird-card-info">
        <span class="pulse"></span>
        <span>
          <span class="bird-name">${bird.comName}</span>
          <span class="bird-sci">${bird.sciName}</span>
        </span>
      </span>
      <button class="mute-btn" data-code="${bird.speciesCode}" aria-label="Mute ${bird.comName}" title="Mute ${bird.comName}">♪</button>
    `;
    chorusEl.appendChild(card);
  });
  chorusEl.querySelectorAll('.mute-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleMute(btn.dataset.code));
  });
}

function toggleMute(code){
  const card = document.getElementById('card-' + code);
  const btn = card ? card.querySelector('.mute-btn') : null;
  if(mutedBirds.has(code)){
    mutedBirds.delete(code);
    if(card) card.classList.remove('muted');
    if(btn){ btn.textContent = '♪'; btn.setAttribute('aria-label','Mute'); }
  }else{
    mutedBirds.add(code);
    if(card) card.classList.add('muted');
    if(btn){ btn.textContent = '×'; btn.setAttribute('aria-label','Unmute'); }
  }
  const g = gainNodes[code];
  if(g && audioCtx){
    const now = audioCtx.currentTime;
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(mutedBirds.has(code) ? 0 : g._baseValue, now + 0.4);
  }
}

// ---------- Audio ----------
function stopAll(){
  activeSources.forEach(s => { try{ s.stop(); }catch(e){} });
  activeSources = [];
  if(audioCtx){ audioCtx.close().catch(()=>{}); audioCtx = null; }
  document.querySelectorAll('.bird-card').forEach(c => c.classList.remove('active'));
}

async function playChorus(birds){
  stopAll();
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  gainNodes = {};

  const buffers = await Promise.all(birds.map(async bird => {
    try{
      const res = await fetch(bird.audioUrl);
      const arr = await res.arrayBuffer();
      const buf = await audioCtx.decodeAudioData(arr);
      return buf;
    }catch(e){
      return null;
    }
  }));

  birds.forEach((bird, i) => {
    const buf = buffers[i];
    if(!buf) return;
    const delay = i * (1.2 + Math.random()*1.8);
    const source = audioCtx.createBufferSource();
    source.buffer = buf;
    source.loop = true;
    const gain = audioCtx.createGain();
    const baseValue = 0.7 / Math.sqrt(birds.length);
    gain._baseValue = baseValue;
    const startAt = audioCtx.currentTime + delay;
    const target = mutedBirds.has(bird.speciesCode) ? 0 : baseValue;
    gain.gain.setValueAtTime(0, startAt);
    gain.gain.linearRampToValueAtTime(target, startAt + FADE_SECONDS);
    gainNodes[bird.speciesCode] = gain;
    source.connect(gain).connect(audioCtx.destination);
    source.start(audioCtx.currentTime + delay);
    activeSources.push(source);

    setTimeout(() => {
      const card = document.getElementById('card-' + bird.speciesCode);
      if(card){
        card.classList.add('active');
        if(mutedBirds.has(bird.speciesCode)) card.classList.add('muted');
      }
      const activeCount = document.querySelectorAll('.bird-card.active').length;
      setSkyProgress(activeCount / birds.length);
    }, delay * 1000);
  });
}
</script>
