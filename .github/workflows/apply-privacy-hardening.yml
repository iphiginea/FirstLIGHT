name: Apply privacy hardening

on:
  push:
    branches:
      - security/privacy-share
    paths:
      - '.privacy-hardening-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/privacy-share
      - name: Remove precise coordinates from shared chorus links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = """    place: placeLabel,\n    lat: currentCoords.lat,\n    lng: currentCoords.lng"""
          new = """    place: placeLabel,\n    lat: Number(currentCoords.lat.toFixed(1)),\n    lng: Number(currentCoords.lng.toFixed(1))"""
          if old not in s:
              raise SystemExit('Expected share payload not found; refusing to modify file')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --exit-code && exit 0
          git commit -m 'Harden shared chorus location privacy'
          git push
