name: Probe First Light bird proxy

on:
  push:
    paths:
      - '.github/workflows/probe-firstlight-proxy.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate notable routes
        shell: bash
        run: |
          set +e
          BASE='https://firstlight-bird-proxy.kiah-harpool.workers.dev'
          URLS=(
            "$BASE/ebird/notable?lat=41.8781&lng=-87.6298"
            "$BASE/ebird/recent/notable?lat=41.8781&lng=-87.6298"
            "$BASE/ebird/recent?notable=true&lat=41.8781&lng=-87.6298"
          )
          for URL in "${URLS[@]}"; do
            echo "=== $URL ==="
            curl -sS -w '\nHTTP_STATUS=%{http_code}\n' "$URL" -o /tmp/body 2>/tmp/err
            CODE=$?
            echo "curl_exit=$CODE"
            head -c 700 /tmp/body || true
            echo
            cat /tmp/err || true
          done
